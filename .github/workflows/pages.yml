name: Auf GitHub Pages veroeffentlichen

# Voraussetzung: Settings -> Pages -> Source auf "GitHub Actions" stellen.
on:
  push:
    branches: [main, master, claude/knotenpunkt-game-9w263m]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        # Schaltet GitHub Pages beim ersten Lauf selbst ein.
        with:
          enablement: true
      - name: Statische Dateien einsammeln
        run: |
          mkdir -p _site
          cp -r index.html manifest.webmanifest sw.js css src icons _site/
          cp RULES.md _site/ 2>/dev/null || true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
