name: Tests

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regel-Engine testen
        run: node --test tests/*.test.js
      - name: Oberflaeche im Browser testen
        run: node tools/smoke-test.js
        env:
          CHROME: /usr/bin/google-chrome
      - name: Balance stichprobenartig pruefen
        run: node tools/simulate.js 120 3
