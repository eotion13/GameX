name: Tests

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regel-Engine testen
        run: node --test tests/*.test.js
      - name: Oberflaeche im Browser testen
        env:
          CHROME: /usr/bin/google-chrome
        run: |
          for i in 1 2 3; do
            if node tools/smoke-test.js; then exit 0; fi
            echo "Smoke Versuch $i fehlgeschlagen — neuer Versuch…"
            sleep 3
          done
          exit 1
      - name: Online-Modus im Browser testen
        env:
          CHROME: /usr/bin/google-chrome
        run: |
          for i in 1 2 3; do
            if node tools/online-smoke.js; then exit 0; fi
            echo "Online-Smoke Versuch $i fehlgeschlagen — neuer Versuch…"
            sleep 3
          done
          exit 1
      - name: Balance stichprobenartig pruefen
        run: node tools/simulate.js 120 3
